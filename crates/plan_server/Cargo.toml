[package]
name = "plan_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/plan_server.rs"

[[bin]]
name = "plan_server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
plan_core.workspace = true
rmcp = { workspace = true, features = ["schemars"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
plan_core.workspace = true
